# Lint, unit tests, database tests (real migrations on Postgres 16), the push Edge Function
# on Deno (its runtime), and a production build.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:tests
      - run: npm test
      - run: npm run test:db
      - name: Push Edge Function on Deno (type-check + runtime test)
        env:
          DENO: npx --yes deno@2.5.6
        run: |
          $DENO check --no-lock --config supabase/functions/push-dispatch/deno.json supabase/functions/push-dispatch/index.ts
          $DENO test --no-lock --allow-env --allow-read --config supabase/functions/push-dispatch/deno.json supabase/functions/push-dispatch/runtime_test.ts
      - run: npm run build
